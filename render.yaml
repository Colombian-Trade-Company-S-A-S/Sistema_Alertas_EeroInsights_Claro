# Blueprint de Render para el servicio de WhatsApp.
# Crea un Web Service con disco persistente para alertas.db.
services:
  - type: web
    name: eero-alertas-whatsapp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/alertas.db
      - key: DRY_RUN
        value: "false"
      # Master switch del push automatico. false = nadie recibe push (solo consulta).
      - key: ALERTAS_PUSH_ENABLED
        value: "true"
      # Modo: true = HIBRIDO (solo autorizados de ALERTAS_PUSH_NUMBERS, max 2);
      # false = COMPLETO (push a TODOS los numeros de alta).
      - key: ALERTAS_MODO_HIBRIDO
        value: "true"
      # Hasta 2 numeros autorizados en modo hibrido (con indicativo, coma-separados).
      # Se administra desde el panel de Render (Environment).
      - key: ALERTAS_PUSH_NUMBERS
        sync: false
      # Bot exclusivo: true = solo responde a numeros de alta; false = a cualquiera.
      - key: BOT_SOLO_SUSCRITOS
        value: "true"
      # Modulo de "no saludables" (Redes con problemas). false = APAGADO (solo caidas).
      - key: UNHEALTHY_ENABLED
        value: "true"
      # true = las no saludables CRITICAS se notifican en tiempo real junto a las
      # caidas (mismo ciclo y mismo consolidado). false = reporte diario.
      - key: UNHEALTHY_TIEMPO_REAL
        value: "true"
      # Hora local (Colombia) del reporte diario (solo si UNHEALTHY_TIEMPO_REAL=false).
      - key: UNHEALTHY_REPORT_HOUR
        value: "9"
      # Redes de prueba a excluir del monitoreo (IDs separados por coma).
      # Se administra desde el panel de Render (Environment): editar el valor y
      # el servicio redespliega. Dejar sin valor = no excluir ninguna.
      - key: EXCLUDED_NETWORK_IDS
        sync: false
      # Los demas (EERO_ADMIN_TOKEN, WA_TOKEN, WA_PHONE_NUMBER_ID,
      # WA_TEMPLATE_NAME, WA_RECIPIENTS, WA_VERIFY_TOKEN, etc.) se cargan
      # como variables de entorno en el panel de Render (Environment).
